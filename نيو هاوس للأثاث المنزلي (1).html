<style>

:root[data-theme="dark"]{--bg:#14132e;--card:#1e1d42;--text:#f0effa;--muted:#a7a5cc;--line:#33315e;--gold:#f2a85a;--gold2:#e8892b;--dark:#0d0c20;--danger:#f97066}

.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:zoom-in;background:var(--line)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:10;display:flex;align-items:center;justify-content:center}
.lb img{max-width:94%;max-height:90%;border-radius:12px}

.btn{border:0;border-radius:12px;padding:8px 16px;background:var(--gold);color:var(--ongold,#2a1c10);font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;border-radius:10px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.field{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.edit-row{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.edit-row .r{display:flex;gap:6px;align-items:center}
.lbl{font-size:13px;color:var(--muted);margin:10px 0 4px;display:block}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.bar{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:center;z-index:5}

</style>

<script>

const app=document.getElementById("app");
function applyAccent(){const c=/^#[0-9a-f]{6}$/i.test(state.accent)?state.accent:"#e8892b";const n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,m=v=>Math.round(v+(255-v)*.3),st=document.documentElement.style;st.setProperty("--gold",c);st.setProperty("--gold2","rgb("+m(r)+","+m(g)+","+m(b)+")");st.setProperty("--ongold",(.299*r+.587*g+.114*b)>150?"#1f1d47":"#fff")}
async function shrink(file){try{const bmp=await createImageBitmap(file),s=Math.min(1,1400/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.85))}catch(e){return file}}
function openLb(u){const d=el("div",{class:"lb",onclick:()=>d.remove()},el("img",{src:u,alt:""}));document.body.append(d)}
function href(l){
  let u=(l.url||"").trim();if(!u)return "";

  switch(l.type){
    case "whatsapp":{const d=u.replace(/[^\d]/g,"");if(d.length>=7&&!/[a-z]/i.test(u))return "https://wa.me/"+d;break}

    case "instagram":if(!/\./.test(u))return "https://instagram.com/"+h;break;
    case "telegram":if(!/\./.test(u))return "https://t.me/"+h;break;
    case "x":if(!/\./.test(u))return "https://x.com/"+h;break;
    case "tiktok":if(!/\./.test(u))return "https://tiktok.com/@"+h;break;
    case "snapchat":if(!/\./.test(u))return "https://snapchat.com/add/"+h;break;

function el(tag,attrs={},...kids){

  for(const[k,v]of Object.entries(attrs)){
    if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k==="html")e.innerHTML=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);
  }
  kids.flat().forEach(c=>c&&e.append(c));return e;
}
const icon=t=>{const v=(TYPES[t]||TYPES.website)[1];return v.startsWith("<svg")?el("span",{class:"ic",html:v}):el("span",{class:"ic",text:v})};
function render(){

    card.append(el("h1",{text:state.name}),el("div",{class:"orn",text:"◆"}),el("div",{class:"bio",text:state.bio}));

    if(ws)card.append(el("a",{class:"cta",href:href(ws),target:"_blank",rel:"noopener noreferrer"},el("span",{html:TYPES.whatsapp[1]}),el("span",{text:ws.label||"تواصل عبر واتساب"})));

      list.append(el("a",{class:"link",href:h,target:"_blank",rel:"noopener noreferrer"},icon(l.type),el("span",{text:l.label||(TYPES[l.type]||TYPES.website)[0]}),el("span",{class:"go",text:"›"})));

    if(state.gallery&&state.gallery.length){card.append(el("div",{class:"sec",text:"معرض المفروشات"}));const g=el("div",{class:"gal"});state.gallery.forEach(u=>g.append(el("img",{src:u,loading:"lazy",alt:"",onclick:()=>openLb(u)})));card.append(g)}
    if(state.hours||state.address)card.append(el("div",{class:"info"},state.hours&&el("div",{text:"🕘 "+state.hours}),state.address&&el("div",{text:"📍 "+state.address})));
  }else card.append(editor());

  if(editing)app.append(el("div",{class:"bar"},el("button",{class:"btn",text:busy||"💾 حفظ ونشر",onclick:save}),el("button",{class:"btn ghost",text:"إلغاء",onclick:()=>location.reload()})));
}
function inp(label,key,multi){

  });
  box.append(list,el("div",{style:"margin-top:10px"},el("button",{class:"btn ghost",text:"＋ إضافة رابط",onclick:()=>{state.links.push({id:"l"+Date.now(),type:"website",label:"موقع ويب",url:""});render()}})));
  return box;

function ph(t){return({whatsapp:"رقم الهاتف مع رمز الدولة، مثل 963900000000",email:"name@example.com",phone:"+963900000000",instagram:"اسم المستخدم أو الرابط",telegram:"اسم المستخدم أو الرابط",x:"اسم المستخدم أو الرابط",tiktok:"اسم المستخدم أو الرابط",snapchat:"اسم المستخدم أو الرابط",location:"رابط الموقع من خرائط جوجل"})[t]||"https://..."}

async function save(){

render();
(async()=>{
